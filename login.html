<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Cantina Lindaura</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>

    <main class="pagina-login">

        <section class="login-container">

            <a href="index.html" class="voltar">
                ← Voltar para a cantina
            </a>

            <div class="cabecalho-login">
                <img src="img/logolindaura.png" alt="Logo do Colégio Lindaura">
                <h1>Bem-vindo(a)!</h1>
                <p>
                    Entre na sua conta para fazer seus pedidos.
                </p>
            </div>


            <form class="formulario-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >
                </div>


                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >
                </div>


                <div class="opcoes-login">
                    <label>
                        <input type="checkbox">
                        Lembrar de mim
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>


                <button type="submit" class="botao-entrar">
                    Entrar
                </button>
            </form>


            <div class="cadastro">
                <p>
                    Ainda não tem uma conta?
                    <a href="#">Criar conta</a>
                </p>
            </div>

        </section>

    </main>

</body>
</html>
